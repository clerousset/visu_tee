apiVersion: v1
kind: Service
metadata:
  name: {{ include "visu-tee.fullname" . }}
  labels:
    {{- include "visu-tee.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "visu-tee.selectorLabels" . | nindent 4 }}
