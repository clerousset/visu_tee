<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorateur des comptes nationaux</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1><span class="dot"></span> Explorateur de la comptabilité nationale</h1>
  <div class="sub">Comptes nationaux annuels (INSEE) · partez d'un agrégat économique et décomposez-le avec ses identités comptables</div>
</header>

<div id="root">
  <div class="loading-fallback">Chargement…</div>
</div>

<script>
// Charge React, ReactDOM (UMD, production) depuis plusieurs CDN avec repli
// automatique, puis les scripts de l'application, dans l'ordre.
function loadResource(candidateUrls, cb) {
  (function tryNext(i) {
    if (i >= candidateUrls.length) { cb(false); return; }
    var s = document.createElement('script');
    s.src = candidateUrls[i];
    s.onload = function () { cb(true); };
    s.onerror = function () { tryNext(i + 1); };
    document.head.appendChild(s);
  })(0);
}

function loadSequence(resources, cb) {
  (function next(i) {
    if (i >= resources.length) { cb(true); return; }
    loadResource(resources[i], function (ok) {
      if (!ok) { cb(false, resources[i]); return; }
      next(i + 1);
    });
  })(0);
}

loadSequence([
  [
    'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
    'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
    'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
  ],
  [
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
  ],
  ['graph.js'],
  ['data/tee_graph.js'],
  ['app.js'],
], function (ok, failedResource) {
  if (!ok) {
    var root = document.getElementById('root');
    root.innerHTML = '<div class="loading-fallback error">Impossible de charger une ressource nécessaire au site '
      + '(' + failedResource.join(' / ') + '). Vérifiez votre connexion internet et rechargez la page.</div>';
  }
});
</script>
</body>
</html>
